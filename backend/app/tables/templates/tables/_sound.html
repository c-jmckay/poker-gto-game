{% load static %}
<button class="outline" type="button" id="table-sound" aria-label="Game sound" aria-pressed="false" title="Unmute sound"
                data-fold="{% static 'tables/sounds/fold.wav' %}"
                data-check="{% static 'tables/sounds/check.mp3' %}"
                data-bet="{% static 'tables/sounds/bet.wav' %}"
                data-stack="{% static 'tables/sounds/chips-stack.m4a' %}">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h4l5-4v14l-5-4H3z"/>
        <path class="sound-waves" d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
        <path class="mute-slash" d="M3 3l18 18"/>
    </svg>
</button>
<audio id="button-click" preload="auto" src="{% static 'tables/sounds/click.wav' %}"></audio>
